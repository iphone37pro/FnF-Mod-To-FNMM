<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FNF / Psych / Codename → Funky Maker (.FNMM)</title>
<style>
:root{--bg:#fff;--fg:#1a1a2e;--card:#f3f1fa;--ac:#7c3aed;--mut:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--fg:#eee;--card:#221f33;--ac:#a78bfa;--mut:#aaa}}
:root[data-theme="dark"]{--bg:#14121f;--fg:#eee;--card:#221f33;--ac:#a78bfa;--mut:#aaa}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:720px;margin:auto}
h1{font-size:1.25rem}h2{font-size:1.02rem;margin:0 0 8px}
.card{background:var(--card);border-radius:12px;padding:14px;margin:14px 0}
input,select{width:100%;margin:6px 0;box-sizing:border-box;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
label.c{color:var(--fg)}label.c input{width:auto}
button,a.b{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;text-decoration:none;margin-top:8px}
button:disabled{opacity:.4}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:280px;overflow-y:auto;margin:8px 0 0}
p.m{color:var(--mut);font-size:13px;margin:4px 0}
progress{width:100%;height:14px;margin-top:10px}
</style>
</head>
<body>
<h1>FNF / Psych / Codename → Funky Maker (.FNMM)</h1>
<p class="m">Acepta mods de Psych Engine y de Codename Engine. Todo se procesa en tu navegador.</p>

<div class="card">
<h2>1. Pon el mod</h2>
<label>Mod en .zip o .rar</label>
<input type="file" id="zip" accept=".zip,.rar">
<label>…o la carpeta del mod</label>
<input type="file" id="dir" webkitdirectory>
<label>Canción / dificultad</label>
<select id="chart"><option>(carga un mod primero)</option></select>
</div>

<div class="card">
<h2>2. Opciones</h2>
<label class="c"><input type="checkbox" id="swap"> Invertir: jugador en la strumline 2 y oponente en la 1</label>
<label>Audio ya mezclado Inst+Voces (.ogg o .mp3, opcional)</label>
<input type="file" id="aud" accept=".ogg,.mp3,audio/ogg,audio/mpeg">
<label>Imagen de fondo (opcional; si el mod trae escenario se usa ese)</label>
<input type="file" id="bg" accept="image/*">
<button id="go" disabled>Portear a .FNMM</button>
<progress id="bar" max="100" value="0" hidden></progress>
<p class="m" id="pl"></p>
<button id="dl" hidden>Descargar .FNMM</button>
<p class="m" id="dlmsg"></p>
<pre id="log"></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const log=m=>{$('log').textContent+=m+'\n'};
const tick=()=>new Promise(r=>setTimeout(r,0));
const prog=async(p,l)=>{const b=$('bar');b.hidden=false;if(p==null)b.removeAttribute('value');else b.value=p;if(l!=null)$('pl').textContent=(p==null?'':Math.round(p)+'% · ')+l;await tick()};
let outBlob=null,outName='';
const clean=s=>(''+s).toLowerCase().replace(/[^a-z0-9]/g,'')||'x';
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let files={};

// El .FNMM guarda todos los números como flotantes (1.0): se imita eso.
const F=o=>JSON.stringify(o).replace(/(?<=[:\[,])(-?\d+)(?=[,}\]])/g,'$1.0');
const find=re=>Object.keys(files).find(k=>re.test(k));
const buf=k=>files[k].get();
const text=async k=>new TextDecoder().decode(await buf(k));
const load=async k=>{const t=(await text(k)).replace(/^\uFEFF/,'').replace(/\0+$/,'');try{return JSON.parse(t)}catch(e){try{return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}catch(e2){throw new Error(`JSON inválido en ${k}: ${e.message}`)}}};
const xml=async k=>new DOMParser().parseFromString(await text(k),'text/xml');
const bmp=async k=>createImageBitmap(new Blob([await buf(k)]));
const png=c=>new Promise(r=>c.toBlob(r,'image/png'));
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};

async function setFiles(map){
  files=map;
  const sel=$('chart');sel.innerHTML='';$('go').disabled=true;
  const ks=Object.keys(files).filter(k=>/(^|\/)(data\/[^\/]+|songs\/[^\/]+\/charts)\/[^\/]+\.json$/.test(k)&&!/\/(events|meta)\.json$/.test(k)).sort();
  for(const k of ks){
    try{
      const j=await load(k),S=j.song&&typeof j.song==='object'?j.song:j;
      if(!Array.isArray(S.notes)&&!Array.isArray(j.strumLines))continue;
      const o=document.createElement('option');o.value=k;o.textContent=(Array.isArray(j.strumLines)?'[Codename] ':'[Psych] ')+k.split('/').slice(-3).join(' / ');sel.appendChild(o);
    }catch(e){}
  }
  $('go').disabled=!sel.options.length;
  $('log').textContent=sel.options.length?`Mod cargado: ${Object.keys(files).length} archivos, ${sel.options.length} charts.\n`:'No encontré charts de canciones (Psych: data/<cancion>/*.json · Codename: songs/<cancion>/charts/*.json).\n';
}
const loadRarLib=()=>window.unrarit?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/unrarit@0.0.5/dist/unrarit.umd.js';s.onload=ok;s.onerror=()=>no(new Error('no se pudo cargar el lector RAR'));document.head.appendChild(s)});
$('zip').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('log').textContent='Leyendo '+f.name+'… (los RAR grandes tardan)\n';
  prog(null,'Leyendo el mod…');
  try{
    const h=new Uint8Array(await f.slice(0,4).arrayBuffer()),m={};
    if(h[0]===0x52&&h[1]===0x61&&h[2]===0x72){
      await loadRarLib();
      if(!window.unrarit)throw new Error('lector RAR no disponible');
      const {entries}=await window.unrarit.unrar(f);
      for(const [n,x] of Object.entries(entries))if(!x.isDirectory)m[n.replace(/\\/g,'/').toLowerCase()]={get:()=>x.arrayBuffer()};
    }else{
      const z=await JSZip.loadAsync(f);
      z.forEach((p,x)=>{if(!x.dir)m[p.toLowerCase()]={get:()=>x.async('arraybuffer')}});
    }
    await setFiles(m);
    await prog(100,'Mod cargado');
  }catch(err){$('bar').hidden=true;$('pl').textContent='';$('log').textContent='No pude abrir el archivo: '+err.message+'\nSi es .rar, conviértelo a .zip e inténtalo de nuevo.\n'}
};
$('dir').onchange=e=>{
  const m={};
  [...e.target.files].forEach(f=>{m[f.webkitRelativePath.toLowerCase()]={get:()=>f.arrayBuffer()}});
  setFiles(m);
};

function placeholder(name){
  const c=cv(256,256),x=c.getContext('2d');
  x.fillStyle=`hsl(${[...name].reduce((a,ch)=>a+ch.charCodeAt(0)*7,0)%360} 60% 50%)`;
  x.fillRect(8,8,240,240);x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText(name.slice(0,12),128,136);
  return c;
}

// ---------- descripción de personaje (Codename XML o Psych JSON) ----------
const parseIdx=s=>!s?[]:s.split(',').flatMap(t=>{t=t.trim();const m=t.match(/^(\d+)\.\.(\d+)$/);return m?Array.from({length:m[2]-m[1]+1},(_,i)=>+m[1]+i):t===''?[]:[+t]});
async function getChar(name){
  const lo=esc(name.toLowerCase());
  const kx=find(new RegExp('(^|/)data/characters/'+lo+'\\.xml$'));
  if(kx){
    const r=(await xml(kx)).documentElement,g=a=>r.getAttribute(a);
    return {A:[...r.querySelectorAll('anim')].map(e=>({n:e.getAttribute('name'),p:e.getAttribute('anim'),o:[+e.getAttribute('x')||0,+e.getAttribute('y')||0],fps:+e.getAttribute('fps')||24,idx:parseIdx(e.getAttribute('indices'))})),
      img:'characters/'+(g('sprite')||name),icon:g('icon')||name,cs:+g('scale')||1,x:+g('x')||0,y:+g('y')||0};
  }
  const kj=find(new RegExp('(^|/)characters/'+lo+'\\.json$'));
  if(kj){const j=await load(kj);return {A:(j.animations||[]).map(a=>({n:a.anim,p:a.name,o:a.offsets||[0,0],fps:a.fps||24,idx:a.indices||[]})),img:j.image||'',icon:j.healthicon||name,cs:1,x:0,y:0}}
  return null;
}

// Personaje -> sprites/<spr>/ (tipo 1: una tira horizontal por animación). Anims 0-5: idle, izq, abajo, arriba, der, hey; luego las extra pedidas por eventos.
async function buildChar(name,z,extra){
  const spr=clean(name),d=await getChar(name),data=[];
  let sheet=null;
  if(d){
    const b=esc(d.img.toLowerCase());
    const kp=find(new RegExp('(^|/)images/'+b+'\\.png$')),kx=find(new RegExp('(^|/)images/'+b+'\\.xml$'));
    if(kp&&kx)sheet={img:await bmp(kp),xml:await xml(kx)};
  }
  const base={icon:d?d.icon:name,cs:d?d.cs:1,x:d?d.x:0,y:d?d.y:0};
  if(!sheet){
    log(`⚠ ${name}: sin atlas Sparrow en el mod (¿personaje del juego base o Animate Atlas?). Uso un recuadro de relleno.`);
    const p0=await png(placeholder(name));
    for(let i=0;i<6;i++){z.file(`sprites/${spr}/${i}.png`,p0);data.push({offset:{x:128,y:128},loop:true,num:1,spd:1,scale:1.1235955056179776,spd_fps:false,bilinear:true})}
    z.file(`sprites/${spr}/sprite.json`,F({data,type:1}));
    return {spr,...base,W:256,H:256,extra:[]};
  }
  const g=(e,a)=>+e.getAttribute(a)||0;
  const subs=[...sheet.xml.querySelectorAll('SubTexture')].map(e=>({n:e.getAttribute('name'),x:g(e,'x'),y:g(e,'y'),w:g(e,'width'),h:g(e,'height'),fx:g(e,'frameX'),fy:g(e,'frameY')}));
  const pick=(...re)=>{for(const r of re){const a=d.A.find(a=>r.test(a.n));if(a)return a}return null};
  const idle=pick(/^idle$/i,/^danceleft$/i,/^idle/i)||d.A[0];
  const slots=[idle,pick(/^singleft$/i)||idle,pick(/^singdown$/i)||idle,pick(/^singup$/i)||idle,pick(/^singright$/i)||idle,pick(/^hey$/i)||idle];
  const ex=extra.filter(n=>!/^(idle|singleft|singdown|singup|singright|hey)$/i.test(n));
  ex.forEach(n=>slots.push(d.A.find(a=>a.n.toLowerCase()===n.toLowerCase())||idle));
  const suf=s=>+(s.n.match(/(\d+)$/)||[0,0])[1];
  const frames=a=>{
    let l=subs.filter(s=>s.n.startsWith(a.p)&&/^\d+$/.test(s.n.slice(a.p.length))).sort((p,q)=>suf(p)-suf(q));
    if(a.idx&&a.idx.length)l=a.idx.map(i=>l[i]||l[l.length-1]).filter(Boolean);
    return l.slice(0,62).map(s=>({s,dx:-s.fx-a.o[0],dy:-s.fy-a.o[1]}));
  };
  const fl=slots.map(a=>a?frames(a):[]);
  const all=fl.flat();
  if(!all.length){log(`⚠ ${name}: no pude leer animaciones.`);return {spr,...base,W:256,H:256,extra:[]}}
  const x0=Math.min(...all.map(f=>f.dx)),y0=Math.min(...all.map(f=>f.dy));
  const W=Math.ceil(Math.max(...all.map(f=>f.dx+f.s.w))-x0),H=Math.ceil(Math.max(...all.map(f=>f.dy+f.s.h))-y0);
  const nmax=Math.max(...fl.map(l=>l.length));
  const k=Math.min(1,16000/(nmax*W),3000/H);
  const cw=Math.round(W*k),ch=Math.round(H*k);
  for(let i=0;i<slots.length;i++){
    const l=fl[i].length?fl[i]:fl[0],c=cv(cw*l.length,ch),x=c.getContext('2d');
    l.forEach((f,j)=>x.drawImage(sheet.img,f.s.x,f.s.y,f.s.w,f.s.h,j*cw+(f.dx-x0)*k,(f.dy-y0)*k,f.s.w*k,f.s.h*k));
    z.file(`sprites/${spr}/${i}.png`,await png(c));
    data.push({offset:{x:cw/2,y:ch/2},loop:true,num:l.length,spd:(slots[i]||{}).fps||24,scale:1/k,spd_fps:true,bilinear:true});
  }
  z.file(`sprites/${spr}/sprite.json`,F({data,type:1}));
  return {spr,...base,W,H,extra:ex};
}

// Icono -> sprites/icon<nombre>/ (tipo 3: dos animaciones de 1 frame)
async function buildIcon(hn,z){
  const spr='icon'+clean(hn),n=esc((hn||'face').toLowerCase());
  const k=find(new RegExp('(^|/)images/icons/((icon-)?'+n+'|'+n+'/icon)\\.png$'));
  let parts=[];
  if(k){
    const im=await bmp(k),c0=Math.max(1,Math.round(im.width/im.height)),w=im.width/c0;
    for(let i=0;i<Math.min(2,c0);i++){const c=cv(w,im.height);c.getContext('2d').drawImage(im,i*w,0,w,im.height,0,0,w,im.height);parts.push(c)}
    if(parts.length<2)parts.push(parts[0]);
  }else{log(`⚠ Icono "${hn}" no está en el mod; uso relleno.`);parts=[placeholder(hn||'?'),placeholder(hn||'?')]}
  const data=[];
  for(let i=0;i<2;i++){z.file(`sprites/${spr}/${i}.png`,await png(parts[i]));data.push({offset:{x:parts[i].width/2,y:parts[i].height/2},loop:true,num:1,spd:1,scale:1.1235955056179776,spd_fps:false,bilinear:true})}
  z.file(`sprites/${spr}/sprite.json`,F({data,type:3}));
  return spr;
}

// ---------- chart normalizado: strums[{role,chars,notes[[ms,lane,sustainMs]]}], cam[{t,s}], anim[{t,s,name}], chg[{t,s,name}] ----------
function normPsych(S,folder){
  const secs=S.notes||[];let bpm=S.bpm,t=0;
  const secT=secs.map(s=>{if(s.changeBPM&&s.bpm)bpm=s.bpm;const r=t;t+=(s.sectionBeats||4)*60000/bpm;return r});
  const st=[{role:'opp',chars:[S.player2||'dad'],notes:[]},{role:'player',chars:[S.player1||'bf'],notes:[]}];
  secs.forEach(s=>(s.sectionNotes||[]).forEach(n=>{if(n[1]<0)return;const mine=s.mustHitSection?n[1]<4:n[1]>=4;st[mine?1:0].notes.push([n[0],n[1]%4,+n[2]||0])}));
  const N={name:S.song||folder,bpm:S.bpm,stage:S.stage,strums:st,cam:[],anim:[],chg:[],unsup:{}};
  let last=-1;secs.forEach((s,i)=>{const r=s.mustHitSection?1:0;if(r!==last){N.cam.push({t:secT[i],s:r});last=r}});
  const sOf=v=>{v=(''+v).toLowerCase();return /^(bf|boyfriend|0)$/.test(v)?1:/^(dad|opponent|1)$/.test(v)?0:-1};
  (S.events||[]).forEach(e=>(e[1]||[]).forEach(([nm,v1,v2])=>{
    if(nm==='Change Character'&&sOf(v1)>=0)N.chg.push({t:e[0],s:sOf(v1),name:v2});
    else if(nm==='Play Animation'&&sOf(v2)>=0)N.anim.push({t:e[0],s:sOf(v2),name:v1});
    else N.unsup[nm]=(N.unsup[nm]||0)+1;
  }));
  return N;
}
function normCodename(c,meta,extraEv,folder){
  const st=c.strumLines.map(s=>({role:s.position==='boyfriend'?'player':s.position==='dad'?'opp':s.position==='girlfriend'?'gf':s.type===1?'player':s.type===0?'opp':'gf',chars:s.characters||[],notes:(s.notes||[]).map(n=>[n.time,(n.id||0)%4,n.sLen||0])}));
  const N={name:meta.displayName||folder,bpm:meta.bpm||100,stage:c.stage,strums:st,cam:[],anim:[],chg:[],unsup:{}};
  (c.events||[]).concat(extraEv).forEach(e=>{
    const p=e.params||[];
    if(e.name==='Camera Movement')N.cam.push({t:e.time,s:p[0]});
    else if(e.name==='Play Animation')N.anim.push({t:e.time,s:p[0],name:''+p[1]});
    else if(e.name==='Change Character')N.chg.push({t:e.time,s:p[1],name:''+p[3]});
    else N.unsup[e.name]=(N.unsup[e.name]||0)+1;
  });
  N.cam.sort((a,b)=>a.t-b.t);
  return N;
}

$('go').onclick=async()=>{
  $('go').disabled=true;$('dl').hidden=true;$('log').textContent='';$('dlmsg').textContent='';
  await prog(0,'Empezando…');
  try{
    const k=$('chart').value,c=await load(k),isCN=Array.isArray(c.strumLines);
    const parts=k.split('/'),folder=parts[parts.length-(isCN?3:2)];
    let N;
    if(isCN){
      const mk=find(new RegExp('(^|/)songs/'+esc(folder)+'/meta\\.json$')),ek=find(new RegExp('(^|/)songs/'+esc(folder)+'/events\\.json$'));
      N=normCodename(c,mk?await load(mk):{},ek?(await load(ek)).events||[]:[],folder);
    }else{
      const S=c.song&&typeof c.song==='object'?c.song:c,ek=k.replace(/[^\/]+$/,'events.json');
      if(files[ek]&&ek!==k){const e=await load(ek);S.events=(S.events||[]).concat((e.song||e).events||[])}
      N=normPsych(S,folder);
    }
    log(`Formato: ${isCN?'Codename Engine':'Psych Engine'} · Canción: ${N.name} · BPM ${N.bpm} · ${N.strums.length} strumlines`);

    // strumlines -> Funky Maker (0 = jugador, 1 = oponente, 2+ = extra)
    const P=$('swap').checked?1:0,O=1-P,sl=[...Array(6)].map(()=>[[],[],[],[]]);
    const got={},fmS=N.strums.map((s,i)=>{if(s.role==='player'&&!got.p){got.p=1;return P}if(s.role==='opp'&&!got.o){got.o=1;return O}if(!got.n)got.n=2;return got.n<6?got.n++:-1});
    let nn=0;
    N.strums.forEach((s,i)=>{if(fmS[i]<0)return;s.notes.forEach(n=>{sl[fmS[i]][n[1]].push({start:+(n[0]/1000).toFixed(3),props:{onMissEvent:-1,skin:0,onPressEvent:-1},duration:+(n[2]/1000).toFixed(3)});nn++})});
    sl.forEach(s=>s.forEach(l=>l.sort((a,b)=>a.start-b.start)));
    log(`Notas portadas: ${nn}`);
    await prog(8,'Notas listas');

    const z=new JSZip();
    z.file('data.json',F({bpm:N.bpm,version:2,strumLines:sl,npb:4}));

    // audio
    const ov=$('aud').files[0];let ab;
    if(ov)ab=await ov.arrayBuffer();
    else{
      const ik=find(new RegExp('songs/'+esc(folder.toLowerCase())+'/(song/)?inst\\.(ogg|mp3)$'))||find(/(^|\/)inst\.(ogg|mp3)$/);
      if(!ik)throw new Error('No encontré Inst.ogg ni Inst.mp3. Sube un .ogg o .mp3 en las opciones.');
      ab=await buf(ik);
      if(find(/(^|\/)voices[^\/]*\.(ogg|mp3)$/))log('⚠ Usé solo Inst. Para incluir las voces mezcla Inst+Voces en Audacity (exporta .ogg o .mp3) y súbelo en "Audio ya mezclado".');
    }
    const a4=new Uint8Array(ab,0,4);
    if(!(a4[0]===0x4f&&a4[1]===0x67))log('⚠ El audio es MP3, no OGG. Lo guardé como music.ogg; si la app no lo reproduce, conviértelo a .ogg (Audacity) y súbelo en "Audio ya mezclado".');
    z.file('music.ogg',ab);
    await prog(12,'Audio listo');

    // personajes (el primero de cada strumline + los de "Change Character")
    const ch0=s=>N.strums[s]&&N.strums[s].chars[0],extra={},names=new Set();
    N.strums.forEach(s=>s.chars[0]&&names.add(s.chars[0]));N.chg.forEach(c=>c.name&&names.add(c.name));
    const curC=(s,t)=>{let n=ch0(s);N.chg.filter(c=>c.s===s&&c.t<=t).sort((a,b)=>a.t-b.t).forEach(c=>n=c.name);return n};
    N.anim.forEach(a=>{const n=curC(a.s,a.t);if(n)(extra[n]=extra[n]||new Set()).add(a.name)});
    const info={};
    let ci=0;
    for(const n of names){await prog(12+38*ci/names.size,`Personaje ${n}`);log(`Personaje: ${n}`);info[n]=await buildChar(n,z,[...(extra[n]||[])]);ci++}
    await prog(50,'Iconos…');
    const iOf=r=>{const i=N.strums.findIndex(s=>s.role===r);return i<0?null:info[ch0(i)]};
    const iconO=await buildIcon((iOf('opp')||{icon:'face'}).icon,z),iconP=await buildIcon((iOf('player')||{icon:'face'}).icon,z);
    await prog(55,'Escenario…');

    // escenario: Codename XML (sprites estáticos + posiciones). Si no hay, valores por defecto.
    const items=[];let zoom=0.8;
    const stk=N.stage&&find(new RegExp('(^|/)data/stages/'+esc(N.stage.toLowerCase())+'\\.xml$'));
    if(stk){
      const r=(await xml(stk)).documentElement,fo=r.getAttribute('folder')||'';zoom=+r.getAttribute('zoom')||0.8;
      const nu=(e,a,d)=>e.hasAttribute(a)?+e.getAttribute(a):d;
      for(const e of r.children){
        const tag=e.tagName;
        if(tag==='sprite'){
          const b=esc((fo+e.getAttribute('sprite')).toLowerCase()),kp=find(new RegExp('(^|/)images/'+b+'\\.png$'));
          if(!kp||find(new RegExp('(^|/)images/'+b+'\\.xml$'))){log(`⚠ Escenario: omito "${e.getAttribute('sprite')}" (animado o no encontrado).`);continue}
          const im=await bmp(kp),sc=nu(e,'scale',1);
          items.push({k:'spr',kp,w:im.width,h:im.height,x:nu(e,'x',0),y:nu(e,'y',0),sx:nu(e,'scalex',sc),sy:nu(e,'scaley',sc)});
        }else if(['boyfriend','dad','girlfriend'].includes(tag))items.push({k:'char',tag,x:nu(e,'x',0),y:nu(e,'y',0),s:nu(e,'scale',1)});
      }
      log(`Escenario "${N.stage}": ${items.filter(i=>i.k==='spr').length} imágenes.`);
    }
    if(!items.some(i=>i.k==='char'))items.push({k:'char',tag:'dad',x:-450,y:100,s:1},{k:'char',tag:'boyfriend',x:550,y:100,s:1});
    const sprs=items.filter(i=>i.k==='spr');
    const bb=sprs.length?[Math.min(...sprs.map(i=>i.x)),Math.min(...sprs.map(i=>i.y)),Math.max(...sprs.map(i=>i.x+i.w*i.sx)),Math.max(...sprs.map(i=>i.y+i.h*i.sy))]:[-500,-300,1100,700];
    const cx0=(bb[0]+bb[2])/2,cy0=(bb[1]+bb[3])/2,T=(x,y)=>({x:x-cx0+960,y:y-cy0+1046});

    const objects=[],ob=(x,y,sx,sy,spr,str)=>{objects.push({x,y,visible:true,scale:{x:sx,y:sy},fixed:false,strumLine:str,spr});return objects.length-1};
    const bgf=$('bg').files[0];
    if(bgf&&!sprs.length){
      const im=await createImageBitmap(bgf),c2=cv(im.width,im.height);c2.getContext('2d').drawImage(im,0,0);
      z.file('sprites/fondo/0.png',await png(c2));
      z.file('sprites/fondo/sprite.json',F({data:[{offset:{x:im.width/2,y:im.height/2},loop:true,num:1,spd:1,scale:1920/im.width,spd_fps:false,bilinear:true}],type:2}));
      ob(960,1046,1,1,'fondo',-1);
    }
    const roleOf={boyfriend:'player',dad:'opp',girlfriend:'gf'},charObj={},pos={};
    let ns=0;
    for(const it of items){
      if(it.k==='spr'){
        await prog(55+15*ns/Math.max(1,sprs.length),`Escenario ${ns+1}/${sprs.length}`);
        const nm='bg'+(ns++);
        z.file(`sprites/${nm}/0.png`,await buf(it.kp));
        z.file(`sprites/${nm}/sprite.json`,F({data:[{offset:{x:it.w/2,y:it.h/2},loop:true,num:1,spd:1,scale:1,spd_fps:false,bilinear:true}],type:2}));
        const p=T(it.x+it.w*it.sx/2,it.y+it.h*it.sy/2);ob(p.x,p.y,it.sx,it.sy,nm,-1);
      }else{
        const si=N.strums.findIndex(s=>s.role===roleOf[it.tag]),inf=si<0?null:info[ch0(si)];
        if(!inf)continue;
        const S=it.s*inf.cs,p=T(it.x+inf.x+inf.W*S/2,it.y+inf.y+inf.H*S/2);
        charObj[si]=ob(p.x,p.y,S,S,inf.spr,fmS[si]);pos[roleOf[it.tag]]=p;
      }
    }
    const pc=pos.player||{x:1127,y:1111},oc=pos.opp||{x:790,y:1111};
    const scene={icons:[iconO,iconP],objects,cameras:[{x:(pc.x+oc.x)/2,y:(pc.y+oc.y)/2,scale:zoom},{x:pc.x,y:pc.y,scale:zoom},{x:oc.x,y:oc.y,scale:zoom}],landscape:true};
    z.file('scene.json',F(scene));
    await prog(72,'Eventos…');

    // eventos
    const ev=new Map(),add=(tm,type,props)=>{const key=+(tm/1000).toFixed(3);if(!ev.has(key))ev.set(key,[]);ev.get(key).push({props,type})};
    let last=-1;
    N.cam.forEach(c=>{const r=N.strums[c.s]&&N.strums[c.s].role,target=r==='player'?1:r==='opp'?2:0;if(target!==last){add(c.t,'CameraSet',{mode:'focus',easingType:'default',transitionTime:1,transitionTimeUnit:'seconds',target});last=target}});
    const aidx=(cn,name)=>{const m={idle:0,singleft:1,singdown:2,singup:3,singright:4,hey:5}[name.toLowerCase()];if(m!=null)return m;const i=((info[cn]||{}).extra||[]).findIndex(e=>e.toLowerCase()===name.toLowerCase());return i<0?0:6+i};
    N.anim.forEach(a=>{const cn=curC(a.s,a.t);if(charObj[a.s]!=null&&cn)add(a.t,'ObjectAnimationSet',{object:charObj[a.s],anim:aidx(cn,a.name)})});
    N.chg.forEach(c=>{if(charObj[c.s]!=null&&info[c.name])add(c.t,'ObjectSpriteSet',{object:charObj[c.s],sprite:info[c.name].spr})});
    const evl=[...ev.entries()].sort((a,b)=>a[0]-b[0]).map(([time,actions])=>({actions,time}));
    z.file('events.json',F({action_packs:[{actions:[]}],events:evl}));
    log(`Eventos portados: ${evl.length} (cámara, animaciones, cambios de personaje)`);
    const u=Object.entries(N.unsup);
    if(u.length)log('Sin equivalente en Funky Maker (omitidos): '+u.map(([a,b])=>`${a} ×${b}`).join(', '));

    log('Empaquetando…');
    const blob=await z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:1}},m=>{const p=75+m.percent*0.25;$('bar').value=p;$('pl').textContent=Math.round(p)+'% · Empaquetando'});
    outBlob=blob;outName=clean(N.name);$('dl').hidden=false;
    await prog(100,'¡Listo!');
    log(`Listo: ${(blob.size/1048576).toFixed(1)} MB. Pulsa "Descargar" y renombra el archivo de .zip a .FNMM para importarlo en Funky Maker Mobile (CREATE → IMPORT).`);
  }catch(err){log('Error: '+err.message);$('pl').textContent='Falló: '+err.message}
  $('go').disabled=false;
};
$('dl').onclick=async()=>{
  $('dlmsg').textContent='';
  try{
    const d=window.claude&&await window.claude.use('downloads');
    if(!d){$('dlmsg').textContent='Aquí no se puede descargar: abre el artefacto en un navegador.';return}
    await d.save({filename:outName+'.zip',data:outBlob});
    $('dlmsg').textContent='Guardado como '+outName+'.zip. Renómbralo a '+outName+'.FNMM antes de importarlo en Funky Maker.';
  }catch(e){
    const m={declined:'Cancelaste la descarga.',host_unavailable:'Esta app no puede guardar archivos: abre el enlace en un navegador (Chrome) y descarga desde ahí.',too_large:'El archivo es demasiado grande para guardarlo aquí.',rate_limited:'Espera unos segundos e inténtalo de nuevo.'};
    $('dlmsg').textContent=m[e&&e.code]||('No se pudo guardar: '+((e&&e.message)||e));
  }
};
</script>
